<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo Dõi Thời Gian Sử Dụng Máy Tính</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 850px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1, h2 { text-align: center; color: #1c2d42; margin-bottom: 20px; }
        
        .role-selector { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; background: #e9ecef; padding: 12px; border-radius: 8px; }
        .role-selector select, .month-filter select { padding: 8px 15px; font-size: 1rem; font-weight: bold; border-radius: 6px; border: 1px solid #ced4da; cursor: pointer; }

        /* Bảng điều khiển chung */
        .global-controls { text-align: center; margin-bottom: 25px; padding: 15px; background: #e7f1ff; border: 2px dashed #0d6efd; border-radius: 10px; }
        .global-controls h3 { margin-bottom: 10px; color: #0a58ca; }
        
        /* Dashboard 2 người */
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .user-card { background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 10px; padding: 20px; text-align: center; position: relative; }
        .user-card.active-user { border-color: #0d6efd; background: #f0f7ff; }
        
        .user-avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #0d6efd; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        
        .user-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #495057; }
        .timer-display { font-size: 2.2rem; font-weight: bold; color: #0d6efd; margin: 10px 0; font-family: monospace; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #adb5bd; margin-right: 5px; }
        .status-dot.running { background: #198754; box-shadow: 0 0 8px #198754; }

        .controls { display: flex; justify-content: center; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
        button { padding: 8px 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-start { background-color: #198754; color: white; }
        .btn-pause { background-color: #ffc107; color: #212529; }
        .btn-reset { background-color: #dc3545; color: white; }
        .btn-both { background-color: #0d6efd; color: white; font-size: 1rem; padding: 10px 20px; margin: 0 5px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Bộ lọc tháng */
        .table-header-box { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .month-filter { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #1c2d42; }

        /* Bảng lịch sử */
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: center; }
        th { background-color: #0d6efd; color: white; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        
        .month-summary { background-color: #e2e3e5 !important; font-weight: bold; color: #055160; border-top: 2px solid #0d6efd; border-bottom: 2px solid #0d6efd; }
    </style>

    <!-- Import Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNLSyrHap4ohc_ZqlsoFvHTGgk48CQ_I8",
            authDomain: "study-clock-ad976.firebaseapp.com",
            databaseURL: "https://study-clock-ad976-default-rtdb.firebaseio.com",
            projectId: "study-clock-ad976",
            storageBucket: "study-clock-ad976.firebasestorage.app",
            messagingSenderId: "1029431792089",
            appId: "1:1029431792089:web:fbf02f54545ccfb60149c8",
            measurementId: "G-P768BGSD1E"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myRole = 'user_a';
        let uiInterval = null;
        let globalAllData = null;

        function getVNTodayStr() {
            return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Ho_Chi_Minh' });
        }

        let todayStr = getVNTodayStr();

        let dbData = {
            user_a: { accumulated: 0, startTime: null, isRunning: false },
            user_b: { accumulated: 0, startTime: null, isRunning: false }
        };

        window.changeRole = function() {
            myRole = document.getElementById('roleSelect').value;
            updateUI();
        };

        function formatTime(sec) {
            sec = Math.max(0, parseInt(sec) || 0);
            const h = Math.floor(sec / 3600).toString().padStart(2, '0');
            const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function getRealSeconds(userData) {
            if (!userData) return 0;
            let total = userData.accumulated || userData.seconds || 0;
            if (userData.isRunning && userData.startTime) {
                const now = Date.now();
                total += Math.floor((now - userData.startTime) / 1000);
            }
            return total;
        }

        // Lắng nghe dữ liệu ngày hôm nay
        const todayRef = ref(db, `usage/${todayStr}`);
        onValue(todayRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                dbData.user_a = data.user_a || { accumulated: 0, startTime: null, isRunning: false };
                dbData.user_b = data.user_b || { accumulated: 0, startTime: null, isRunning: false };
            }
            updateUI();
        });

        // Lắng nghe toàn bộ dữ liệu lịch sử
        const historyRef = ref(db, 'usage');
        onValue(historyRef, (snapshot) => {
            globalAllData = snapshot.val();
            updateMonthDropdown(globalAllData);
            renderHistory();
        });

        function updateUI() {
            const secA = getRealSeconds(dbData.user_a);
            const secB = getRealSeconds(dbData.user_b);

            document.getElementById('time-a').innerText = formatTime(secA);
            document.getElementById('dot-a').className = `status-dot ${dbData.user_a.isRunning ? 'running' : ''}`;
            
            document.getElementById('time-b').innerText = formatTime(secB);
            document.getElementById('dot-b').className = `status-dot ${dbData.user_b.isRunning ? 'running' : ''}`;

            document.getElementById('card-a').className = `user-card ${myRole === 'user_a' ? 'active-user' : ''}`;
            document.getElementById('card-b').className = `user-card ${myRole === 'user_b' ? 'active-user' : ''}`;

            document.getElementById('btn-start-a').disabled = dbData.user_a.isRunning;
            document.getElementById('btn-pause-a').disabled = !dbData.user_a.isRunning;
            
            document.getElementById('btn-start-b').disabled = dbData.user_b.isRunning;
            document.getElementById('btn-pause-b').disabled = !dbData.user_b.isRunning;
        }

        if (!uiInterval) {
            uiInterval = setInterval(updateUI, 1000);
        }

        window.startTimer = function(role) {
            const now = Date.now();
            set(ref(db, `usage/${todayStr}/${role}`), {
                accumulated: getRealSeconds(dbData[role]),
                startTime: now,
                isRunning: true
            });
        };

        window.pauseTimer = function(role) {
            const currentTotal = getRealSeconds(dbData[role]);
            set(ref(db, `usage/${todayStr}/${role}`), {
                accumulated: currentTotal,
                startTime: null,
                isRunning: false
            });
        };

        window.resetTimer = function(role) {
            if (confirm("Xóa dữ liệu ngày hôm nay của người này?")) {
                set(ref(db, `usage/${todayStr}/${role}`), {
                    accumulated: 0,
                    startTime: null,
                    isRunning: false
                });
            }
        };

        window.startBoth = function() {
            const now = Date.now();
            if (!dbData.user_a.isRunning) {
                set(ref(db, `usage/${todayStr}/user_a`), {
                    accumulated: getRealSeconds(dbData.user_a),
                    startTime: now,
                    isRunning: true
                });
            }
            if (!dbData.user_b.isRunning) {
                set(ref(db, `usage/${todayStr}/user_b`), {
                    accumulated: getRealSeconds(dbData.user_b),
                    startTime: now,
                    isRunning: true
                });
            }
        };

        window.pauseBoth = function() {
            if (dbData.user_a.isRunning) pauseTimer('user_a');
            if (dbData.user_b.isRunning) pauseTimer('user_b');
        };

        // Cập nhật danh sách các Tháng vào Dropdown
        function updateMonthDropdown(allData) {
            const select = document.getElementById('monthSelect');
            if (!select) return;

            const prevValue = select.value;
            const months = new Set();
            
            if (allData) {
                Object.keys(allData).forEach(date => {
                    if (date && date.length >= 7) months.add(date.substring(0, 7));
                });
            }

            select.innerHTML = '<option value="ALL">-- Tất cả các tháng --</option>';

            const sortedMonths = Array.from(months).sort().reverse();
            sortedMonths.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.innerText = `Tháng ${m}`;
                select.appendChild(opt);
            });

            // Giữ lại lựa chọn trước đó nếu có, nếu không mặc định chọn Tất cả
            if (prevValue && Array.from(select.options).some(o => o.value === prevValue)) {
                select.value = prevValue;
            } else {
                select.value = 'ALL';
            }
        }

        // Render lịch sử an toàn
        window.renderHistory = function() {
            const tbody = document.getElementById('history-table');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (!globalAllData) {
                tbody.innerHTML = '<tr><td colspan="3">Đang tải dữ liệu...</td></tr>';
                return;
            }

            const monthSelectEle = document.getElementById('monthSelect');
            const selectedMonth = monthSelectEle ? monthSelectEle.value : 'ALL';
            const dates = Object.keys(globalAllData).sort().reverse();

            const groupedByMonth = {};
            dates.forEach(date => {
                const monthKey = date.substring(0, 7);
                if (selectedMonth && selectedMonth !== 'ALL' && monthKey !== selectedMonth) return;

                if (!groupedByMonth[monthKey]) groupedByMonth[monthKey] = [];
                groupedByMonth[monthKey].push(date);
            });

            if (Object.keys(groupedByMonth).length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">Không có dữ liệu lịch sử</td></tr>';
                return;
            }

            Object.keys(groupedByMonth).sort().reverse().forEach(monthKey => {
                let monthTotalA = 0;
                let monthTotalB = 0;

                groupedByMonth[monthKey].forEach(date => {
                    const dayData = globalAllData[date] || {};
                    const secA = getRealSeconds(dayData.user_a);
                    const secB = getRealSeconds(dayData.user_b);

                    monthTotalA += secA;
                    monthTotalB += secB;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${date}</strong></td>
                        <td>${formatTime(secA)}</td>
                        <td>${formatTime(secB)}</td>
                    `;
                    tbody.appendChild(tr);
                });

                const summaryTr = document.createElement('tr');
                summaryTr.className = 'month-summary';
                summaryTr.innerHTML = `
                    <td>📊 TỔNG THÁNG (${monthKey})</td>
                    <td>${formatTime(monthTotalA)}</td>
                    <td>${formatTime(monthTotalB)}</td>
                `;
                tbody.appendChild(summaryTr);
            });
        };
    </script>
</head>
<body>

<div class="container">
    <h1>⏱️ Theo Dõi Thời Gian Sử Dụng Máy Tính</h1>
    
    <div class="role-selector">
        <label for="roleSelect">💻 Thiết bị này là của:</label>
        <select id="roleSelect" onchange="changeRole()">
            <option value="user_a">Đoàn Thiên Bình - Peko - 🏠</option>
            <option value="user_b">Võ Thừa Phúc - Pin - ⚡</option>
        </select>
    </div>

    <!-- KHUNG ĐIỀU KHIỂN CẢ HAI -->
    <div class="global-controls">
        <h3>⚡ Điều Khiển Song Song 2 Đồng Hồ</h3>
        <button class="btn-both btn-start" onclick="startBoth()">▶️ Bắt Đầu Cả Hai</button>
        <button class="btn-both btn-pause" onclick="pauseBoth()">⏸️ Dừng Cả Hai</button>
    </div>

    <div class="dashboard">
        <!-- Khung Peko -->
        <div class="user-card" id="card-a">
            <img src="peko.png" alt="Peko" class="user-avatar" onerror="this.style.display='none'">
            <div class="user-name"><span class="status-dot" id="dot-a"></span> Đoàn Thiên Bình - Peko - 🏠</div>
            <div class="timer-display" id="time-a">00:00:00</div>
            <div class="controls">
                <button class="btn-start" id="btn-start-a" onclick="startTimer('user_a')">Bắt đầu</button>
                <button class="btn-pause" id="btn-pause-a" onclick="pauseTimer('user_a')">Dừng</button>
                <button class="btn-reset" onclick="resetTimer('user_a')">Reset</button>
            </div>
        </div>

        <!-- Khung Pin -->
        <div class="user-card" id="card-b">
            <img src="pin.png" alt="Pin" class="user-avatar" onerror="this.style.display='none'">
            <div class="user-name"><span class="status-dot" id="dot-b"></span> Võ Thừa Phúc - Pin - ⚡</div>
            <div class="timer-display" id="time-b">00:00:00</div>
            <div class="controls">
                <button class="btn-start" id="btn-start-b" onclick="startTimer('user_b')">Bắt đầu</button>
                <button class="btn-pause" id="btn-pause-b" onclick="pauseTimer('user_b')">Dừng</button>
                <button class="btn-reset" onclick="resetTimer('user_b')">Reset</button>
            </div>
        </div>
    </div>

    <!-- TIÊU ĐỀ BẢNG KÈM BỘ LỌC THÁNG -->
    <div class="table-header-box">
        <h2>📅 Bảng Tổng Kết Lịch Sử</h2>
        <div class="month-filter">
            <label for="monthSelect">🔍 Xem theo tháng:</label>
            <select id="monthSelect" onchange="renderHistory()">
                <option value="ALL">-- Tất cả các tháng --</option>
            </select>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Ngày / Tháng</th>
                <th>Đoàn Thiên Bình - Peko - 🏠</th>
                <th>Võ Thừa Phúc - Pin - ⚡</th>
            </tr>
        </thead>
        <tbody id="history-table">
            <!-- Lịch sử hiển thị ở đây -->
        </tbody>
    </table>
</div>

</body>
</html>
